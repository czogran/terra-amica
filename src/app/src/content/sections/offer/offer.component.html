<app-section-header [title]="'offer.title' | translate" [subtitle]="'offer.subtitle' | translate" />

<section class="services">
  @for (service of services(); track service.title) {
    <div class="card fade-in" tabindex="0">
      <div class="card__inner">
        <div class="card__face card__front">
          <div class="icon bi bi-{{ service.icon }}" aria-hidden="true"></div>
          <div class="title">{{ service.title }}</div>
        </div>
        <div class="card__face card__back" aria-hidden="true">
          <p class="title">{{ service.title }}</p>
        </div>
      </div>
    </div>
  }
</section>

<section class="offer-content">
  @for (paragraph of paragraphs(); track paragraph) {
    <p>{{ paragraph }}</p>
  }
</section>
