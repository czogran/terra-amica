<!doctype html>
<html lang="pl" data-bs-theme="light">
  <head>
    <script>
      (function () {
        const theme = localStorage.getItem('theme-mode') || 'light';
        document.documentElement.setAttribute('data-bs-theme', theme);
      })();
    </script>
    <meta charset="utf-8" />
    <title>TerraAmica</title>
    <meta
      name="description"
      content="Terra Amica — informacje o działalności, ofercie i kontakt. Poznaj nas i skontaktuj się."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link
      rel="preload"
      href="fonts/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/inter-latin-ext-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/manrope-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/manrope-latin-ext-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      .ta-bootstrap-loader {
        position: fixed;
        inset: 0;
        z-index: 5000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background:
          radial-gradient(circle at 50% 43%, rgba(67, 160, 71, 0.12), transparent 44%),
          #f5f7f6;
        color: #388e3c;
        font-family: 'Manrope', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity 300ms ease,
          visibility 0s linear 300ms;
      }

      .ta-bootstrap-loader--visible {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transition: opacity 300ms ease;
      }

      .ta-bootstrap-loader--hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity 300ms ease,
          visibility 0s linear 300ms;
      }

      html[data-bs-theme='dark'] .ta-bootstrap-loader {
        background:
          radial-gradient(circle at 50% 43%, rgba(129, 199, 132, 0.14), transparent 44%),
          #263238;
        color: #81c784;
      }

      .ta-bootstrap-loader__mark {
        width: 84px;
        height: 84px;
        animation: ta-bootstrap-spin 2.4s linear infinite;
        filter: drop-shadow(0 8px 20px rgba(15, 143, 62, 0.25));
      }

      .ta-bootstrap-loader__brand {
        font-size: 0.95rem;
        font-weight: 800;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        margin-inline-start: 0.3em;
      }

      .ta-bootstrap-loader__hint {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 0.75rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        opacity: 0.55;
        animation: ta-bootstrap-pulse 1.6s ease-in-out infinite;
      }

      @keyframes ta-bootstrap-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes ta-bootstrap-pulse {
        0%,
        100% {
          opacity: 0.35;
        }

        50% {
          opacity: 0.7;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .ta-bootstrap-loader__mark {
          animation-duration: 9s;
        }

        .ta-bootstrap-loader__hint {
          animation-duration: 3.2s;
        }
      }
    </style>
    <script>
      (function () {
        var state = { start: performance.now(), shownAt: null, ready: false };
        window.__taInitialLoader = state;

        function reveal() {
          if (state.ready) {
            return;
          }

          var loader = document.getElementById('ta-bootstrap-loader');
          if (!loader || loader.classList.contains('ta-bootstrap-loader--hidden')) {
            return;
          }

          loader.classList.add('ta-bootstrap-loader--visible');
          state.shownAt = performance.now();
        }

        function scheduleReveal() {
          var remaining = Math.max(0, 1000 - (performance.now() - state.start));
          setTimeout(reveal, remaining);
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', scheduleReveal, { once: true });
        } else {
          scheduleReveal();
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <div
      id="ta-bootstrap-loader"
      class="ta-bootstrap-loader"
      role="status"
      aria-live="polite"
      aria-label="Ładowanie Terra Amica"
    >
      <svg
        class="ta-bootstrap-loader__mark"
        viewBox="0 0 100 100"
        aria-hidden="true"
        focusable="false"
      >
        <defs>
          <linearGradient id="ta-bootstrap-gradient" x1="10%" y1="0%" x2="90%" y2="100%">
            <stop offset="0%" stop-color="#0f8f3e" />
            <stop offset="100%" stop-color="#8cc63f" />
          </linearGradient>
        </defs>
        <g transform="translate(50 50)" fill="url(#ta-bootstrap-gradient)">
          <path d="M0,-40 C15,-35 25,-15 0,0 C-10,-10 -15,-25 0,-40 Z" />
          <path d="M0,-40 C15,-35 25,-15 0,0 C-10,-10 -15,-25 0,-40 Z" transform="rotate(60)" />
          <path d="M0,-40 C15,-35 25,-15 0,0 C-10,-10 -15,-25 0,-40 Z" transform="rotate(120)" />
          <path d="M0,-40 C15,-35 25,-15 0,0 C-10,-10 -15,-25 0,-40 Z" transform="rotate(180)" />
          <path d="M0,-40 C15,-35 25,-15 0,0 C-10,-10 -15,-25 0,-40 Z" transform="rotate(240)" />
          <path d="M0,-40 C15,-35 25,-15 0,0 C-10,-10 -15,-25 0,-40 Z" transform="rotate(300)" />
        </g>
        <circle cx="50" cy="50" r="13" fill="currentColor" opacity="0.12" />
        <circle cx="50" cy="50" r="5" fill="currentColor" />
      </svg>
      <span class="ta-bootstrap-loader__brand">Terra Amica</span>
      <span class="ta-bootstrap-loader__hint">Ładowanie</span>
    </div>
  </body>
</html>
